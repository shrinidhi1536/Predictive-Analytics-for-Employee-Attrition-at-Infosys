<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentinel | Infosys Attrition Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root {
    --bg:        #080c14;
    --surface:   #0d1220;
    --surface2:  #111827;
    --border:    rgba(255,255,255,0.07);
    --border2:   rgba(255,255,255,0.12);
    --blue:      #3b7ff5;
    --blue-dim:  rgba(59,127,245,0.12);
    --blue-glow: rgba(59,127,245,0.25);
    --cyan:      #06b6d4;
    --red:       #ef4444;
    --red-dim:   rgba(239,68,68,0.12);
    --amber:     #f59e0b;
    --green:     #10b981;
    --green-dim: rgba(16,185,129,0.12);
    --text:      #f1f5f9;
    --muted:     #64748b;
    --muted2:    #94a3b8;
    --sidebar-w: 240px;
    --radius:    14px;
  }
  [data-theme="light"] {
    --bg:       #f0f4f8;
    --surface:  #ffffff;
    --surface2: #f8fafc;
    --border:   rgba(0,0,0,0.07);
    --border2:  rgba(0,0,0,0.12);
    --text:     #0f172a;
    --muted:    #94a3b8;
    --muted2:   #64748b;
    --blue-dim: rgba(59,127,245,0.08);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    overflow: hidden;
  }

  /* ── SIDEBAR ─────────────────────────────────── */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 28px 16px;
    flex-shrink: 0;
    height: 100vh;
    position: relative;
    z-index: 10;
  }
  .sidebar::after {
    content: '';
    position: absolute;
    top: 0; right: -1px; bottom: 0;
    width: 1px;
    background: linear-gradient(180deg, transparent, var(--blue) 40%, transparent);
    opacity: 0.3;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 8px;
    margin-bottom: 36px;
  }
  .brand-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--blue), var(--cyan));
    border-radius: 8px;
    display: grid;
    place-items: center;
    box-shadow: 0 0 16px var(--blue-glow);
    flex-shrink: 0;
  }
  .brand-name {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 0.05em;
    color: var(--text);
  }
  .brand-tag {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.08em;
    font-family: 'DM Mono', monospace;
  }
  .nav-section {
    font-size: 9px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    letter-spacing: 0.12em;
    padding: 0 8px;
    margin: 16px 0 8px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    color: var(--muted2);
    font-size: 13.5px;
    font-weight: 500;
    text-decoration: none;
    transition: all 0.18s;
    margin-bottom: 2px;
    position: relative;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active {
    background: var(--blue-dim);
    color: var(--blue);
    font-weight: 600;
  }
  .nav-item.active::before {
    content: '';
    position: absolute;
    left: 0; top: 20%; bottom: 20%;
    width: 3px;
    background: var(--blue);
    border-radius: 0 3px 3px 0;
  }
  .nav-badge {
    margin-left: auto;
    background: var(--red);
    color: white;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 20px;
    font-family: 'DM Mono', monospace;
  }
  .nav-logout {
    margin-top: auto;
    color: var(--red) !important;
  }
  .nav-logout:hover { background: var(--red-dim) !important; }

  /* ── MAIN ─────────────────────────────────────── */
  .main {
    flex: 1;
    overflow-y: auto;
    padding: 36px 40px;
    background: var(--bg);
    background-image: radial-gradient(ellipse at 80% 0%, rgba(59,127,245,0.06) 0%, transparent 60%);
  }
  .main::-webkit-scrollbar { width: 5px; }
  .main::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 10px; }

  /* ── PAGE HEADER ──────────────────────────────── */
  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 32px;
  }
  .page-title {
    font-family: 'Syne', sans-serif;
    font-size: 26px;
    font-weight: 800;
    color: var(--text);
    line-height: 1.1;
  }
  .page-subtitle {
    font-size: 13px;
    color: var(--muted2);
    margin-top: 5px;
  }
  .status-chip {
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--green-dim);
    border: 1px solid rgba(16,185,129,0.2);
    color: var(--green);
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: 500;
  }
  .status-dot {
    width: 6px; height: 6px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ── CARDS ────────────────────────────────────── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }
  .card-sm { padding: 18px 22px; }
  .card-title {
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }
  .card-muted { font-size: 11.5px; color: var(--muted); }

  /* ── STAT CARDS ───────────────────────────────── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    position: relative;
    overflow: hidden;
  }
  .stat-card::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 60px; height: 60px;
    border-radius: 50%;
    opacity: 0.08;
    filter: blur(20px);
  }
  .stat-label {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .stat-value {
    font-family: 'Syne', sans-serif;
    font-size: 30px;
    font-weight: 800;
    line-height: 1;
    color: var(--text);
  }
  .stat-sub { font-size: 11px; color: var(--muted); margin-top: 6px; }

  /* ── BUTTONS ──────────────────────────────────── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 18px;
    border-radius: 9px;
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.18s;
  }
  .btn-primary {
    background: var(--blue);
    color: white;
    box-shadow: 0 0 20px var(--blue-glow);
  }
  .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn-ghost {
    background: var(--surface2);
    color: var(--muted2);
    border: 1px solid var(--border2);
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--border2); }
  .btn-danger { background: var(--red-dim); color: var(--red); border: 1px solid rgba(239,68,68,0.2); }

  /* ── FORMS ────────────────────────────────────── */
  .form-group { margin-bottom: 18px; }
  .form-label {
    display: block;
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 7px;
  }
  .form-control {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 9px;
    padding: 11px 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border 0.2s;
    appearance: none;
  }
  .form-control:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-dim); }
  .form-control::placeholder { color: var(--muted); }

  /* ── TABLE ────────────────────────────────────── */
  table { width: 100%; border-collapse: collapse; }
  thead th {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.08em;
    color: var(--muted);
    padding: 10px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  tbody td {
    padding: 13px 14px;
    font-size: 13.5px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--surface2); }

  /* ── BADGES ───────────────────────────────────── */
  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.05em;
    padding: 3px 10px;
    border-radius: 20px;
  }
  .badge-red { background: var(--red-dim); color: var(--red); border: 1px solid rgba(239,68,68,0.2); }
  .badge-amber { background: rgba(245,158,11,0.1); color: var(--amber); border: 1px solid rgba(245,158,11,0.2); }
  .badge-green { background: var(--green-dim); color: var(--green); border: 1px solid rgba(16,185,129,0.2); }
  .badge-blue { background: var(--blue-dim); color: var(--blue); border: 1px solid rgba(59,127,245,0.2); }

  /* ── MODAL ────────────────────────────────────── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(8px);
    display: none;
    place-items: center;
    z-index: 999;
  }
  .modal-overlay.open { display: grid; }
  .modal-box {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 20px;
    padding: 32px;
    width: 520px;
    max-width: 95vw;
    box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    animation: modalIn 0.22s ease-out;
  }
  @keyframes modalIn {
    from { transform: scale(0.96) translateY(8px); opacity: 0; }
    to   { transform: scale(1) translateY(0); opacity: 1; }
  }

  /* ── CHART WRAPPER ────────────────────────────── */
  .chart-wrap { position: relative; }
</style>
